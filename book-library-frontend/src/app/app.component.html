<div class="shell">
  <aside class="sidebar">
    <h2><mat-icon>menu_book</mat-icon> Book Library</h2>
    <button mat-button [class.active]="active === 'catalog'" (click)="active='catalog'"><mat-icon>library_books</mat-icon> Catalogo interno</button>
    <button mat-button [class.active]="active === 'chat'" (click)="active='chat'"><mat-icon>smart_toy</mat-icon> Chat AI</button>
  </aside>
  <main>
    <header><div><h1>Book Library</h1><p>Il tuo catalogo di libri, potenziato dall'AI</p></div></header>
    @if (active === 'catalog') { <app-book-list /> } @else { <app-chat-panel /> }
  </main>
</div>
